<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎲 Chaos Tiles — The Unhinged Board Game</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Supabase JS (optional — game works offline without it) -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0A0A1A;
      --accent: #FF6B00;
      --gold: #FFD700;
      --purple: #9B59B6;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Phaser canvas */
    #game-container canvas {
      display: block;
      image-rendering: pixelated;
    }

    /* Loading fallback */
    #loading-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #FFD700;
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      gap: 16px;
      pointer-events: none;
    }

    #loading-fallback .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 215, 0, 0.2);
      border-top-color: #FFD700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="loading-fallback">
      <div class="spinner"></div>
      <span>🎲 Loading Chaos Tiles...</span>
    </div>
  </div>

  <!-- ── Game Source Files ───────────────────────────────── -->

  <!-- Data -->
  <script src="questions.js"></script>

  <!-- Utilities -->
  <script src="board-config.js"></script>
  <script src="audio.js"></script>

  <!-- Services -->
  <script src="supabase.js"></script>

  <!-- Scenes -->
  <script src="BootScene.js"></script>
  <script src="MenuScene.js"></script>
  <script src="UIScene.js"></script>
  <script src="GameScene.js"></script>
  <script src="GameOverScene.js"></script>

  <!-- Entry point -->
  <script src="game.js"></script>

  <script>
    // Hide loading fallback once Phaser boots
    window.addEventListener('load', () => {
      setTimeout(() => {
        const fb = document.getElementById('loading-fallback');
        if (fb) fb.style.display = 'none';
      }, 800);
    });
  </script>
</body>
</html>
